services:
  db:
    image: mysql:9.0
    restart: always
    environment:
      MYSQL_DATABASE: system_monitoring
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: monitor_user
      MYSQL_PASSWORD: monitor_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=monitor_user
      - DB_PASSWORD=monitor_password
      - DB_NAME=system_monitoring
      - JWT_SECRET=change-this-in-production
      - JWT_REFRESH_SECRET=change-this-too
      - BOOTSTRAP_ADMIN_EMAIL=admin@example.com
      - BOOTSTRAP_ADMIN_PASSWORD=admin123
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
